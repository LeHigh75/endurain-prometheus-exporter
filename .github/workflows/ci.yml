name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: endurain-exporter-ci
      TEST_DATABASE_URL: postgresql://endurain_owner:development-only-owner-password@127.0.0.1:55432/endurain_exporter_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Validate production Compose
        env:
          METRICS_TOKEN: development-only-metrics-token-change-me
        run: docker compose --env-file .env.example config --quiet
      - name: Validate development Compose
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Start isolated PostgreSQL 18
        run: docker compose -f docker-compose.dev.yml up -d --wait database
      - name: Unit and integration tests
        run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan Go vulnerabilities
        run: govulncheck ./...
      - name: Build and start test stack
        run: docker compose -f docker-compose.dev.yml up -d --build --wait exporter
      - name: Smoke test
        run: python3 tests/smoke.py
      - name: Scan image vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          endurain-prometheus-exporter:test
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes
