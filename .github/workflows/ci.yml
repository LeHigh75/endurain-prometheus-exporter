name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: endurain-exporter-ci
      TEST_DATABASE_URL: postgresql://endurain_owner:development-only-owner-password@127.0.0.1:55432/endurain_exporter_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Validate production Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Validate development Compose
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Start isolated PostgreSQL 18
        run: docker compose -f docker-compose.dev.yml up -d --wait database
      - name: Unit and integration tests
        run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan Go vulnerabilities
        run: govulncheck ./...
      - name: Build and start test stack
        run: docker compose -f docker-compose.dev.yml up -d --build --wait exporter
      - name: Smoke test
        run: python3 tests/smoke.py
      - name: Smoke test without builtin authentication
        env:
          METRICS_TOKEN: ""
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait exporter
          python3 tests/smoke.py
      - name: Scan image vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          endurain-prometheus-exporter:test
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes

  publish:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.DOCKERHUB_USERNAME != '' && vars.DOCKERHUB_IMAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:latest
            ${{ vars.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}
