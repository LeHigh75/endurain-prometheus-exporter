services:
  exporter:
    build: .
    image: ${EXPORTER_IMAGE:-endurain-prometheus-exporter:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_TOKEN_FILE: ${METRICS_TOKEN_FILE:-}
      LISTEN_ADDRESS: ":9808"
      SCRAPE_TIMEOUT: ${SCRAPE_TIMEOUT:-5s}
      MAX_SERIES: ${MAX_SERIES:-20000}
      WEB_CONFIG_FILE: ${WEB_CONFIG_FILE:-}
      ACTIVITY_DETAILS: ${ACTIVITY_DETAILS:-false}
    ports:
      - "127.0.0.1:${EXPORTER_PORT:-9808}:9808"
    networks:
      - endurain
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  endurain:
    external: true
    name: ${ENDURAIN_NETWORK:?ENDURAIN_NETWORK required}
